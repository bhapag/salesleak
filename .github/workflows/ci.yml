name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    env:
      # A syntactically valid but deliberately unroutable connection string.
      # Nothing in this workflow talks to a database: the test suite replaces
      # the Prisma client with an in-memory store (tests/helpers/setup.ts),
      # and `prisma generate` and `next build` only need the URL to parse.
      # Real credentials must never be added here.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/salesleak_ci?schema=public
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/salesleak_ci?schema=public
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs strictly from package-lock.json. The repo's
      # postinstall already runs `prisma generate`, which the typecheck and
      # build both need because src/generated/prisma is not committed.
      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
